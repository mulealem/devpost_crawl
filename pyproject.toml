[project]
name = "devpost-rag"
version = "0.1.0"
description = "Crawl Devpost hackathons and projects into a local SQLite database"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
dpr = "devpost_rag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devpost_rag*"]
